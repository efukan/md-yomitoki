name: MDYomitoki

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark
    revision: a7ecfef490df1b17927ea828bc2a73cc0b69990d  # gfm ブランチ
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  MDYomitoki:
    type: application
    platform: macOS
    sources:
      - path: MDYomitoki
        excludes:
          - Info.plist
    dependencies:
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: Sparkle
      - target: MDYomitokiQuickLook  # Contents/PlugIns に入れる
    settings:
      base:
        INFOPLIST_FILE: MDYomitoki/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # MDYomitoki/AppIcon.icon（Icon Composer 形式。Design/AppIcon/make_appicon.py で生成）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      # Finder・Dock に表示名を出すにはローカライズされた InfoPlist.strings が必要。xcconfig の値から生成する。
      - name: Localized Display Name
        inputFiles:
          - $(SRCROOT)/Config/App.xcconfig
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ja.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/InfoPlist.strings
        script: |
          for lang in ja en; do
            dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/${lang}.lproj"
            mkdir -p "$dir"
            printf '"CFBundleDisplayName" = "%s";\n"CFBundleName" = "%s";\n' "$APP_DISPLAY_NAME" "$APP_DISPLAY_NAME" > "$dir/InfoPlist.strings"
          done

  # Finder のスペースキー（Quick Look）で Markdown を見せる機能拡張。Markdown の変換とファイルの読み込みはアプリと共通。
  MDYomitokiQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: MDYomitokiQuickLook
        excludes:
          - Info.plist
          - QuickLook.entitlements
      - path: MDYomitoki/Markdown.swift
      - path: MDYomitoki/TextFile.swift
      - path: MDYomitoki/Resources/preview.css
        buildPhase: resources
      - path: MDYomitoki/Resources/highlight.min.js
        buildPhase: resources
    dependencies:
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
    settings:
      base:
        INFOPLIST_FILE: MDYomitokiQuickLook/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: MDYomitokiQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).quicklook
        CODE_SIGN_ENTITLEMENTS: MDYomitokiQuickLook/QuickLook.entitlements

  MDYomitokiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MDYomitokiTests
    dependencies:
      - target: MDYomitoki
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
        PRODUCT_NAME: MDYomitokiTests

schemes:
  MDYomitoki:
    build:
      targets:
        MDYomitoki: all
        MDYomitokiTests: [test]
    test:
      targets:
        - MDYomitokiTests
